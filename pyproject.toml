[build-system]
build-backend = "hatchling.build"
requires = [ "hatch-vcs", "hatchling" ]

[project]
name = "anndata"
description = "Annotated data."
readme = "README.md"
license = "BSD-3-Clause"
maintainers = [
    { name = "Philipp Angerer", email = "philipp.angerer@helmholtz-munich.de" },
    { name = "Ilan Gold", email = "ilan.gold@helmholtz-munich.de" },
]
authors = [
    { name = "Philipp Angerer" },
    { name = "Alex Wolf" },
    { name = "Isaac Virshup" },
    { name = "Sergei Rybakov" },
    { name = "Ilan Gold" },
]
requires-python = ">=3.12"
classifiers = [
    "Environment :: Console",
    "Framework :: Jupyter",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Natural Language :: English",
    "Operating System :: MacOS :: MacOS X",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
    "Topic :: Scientific/Engineering :: Visualization",
    "Typing :: Typed",
]
dynamic = [ "version" ]
dependencies = [
    "array-api-compat>=1.7.1",
    "h5py>=3.11",
    "legacy-api-wrap",
    "natsort",
    "numpy>=2.1",
    "packaging>=24.2",
    "pandas>=2.3",
    "scipy>=1.14,!=1.17",
    "scverse-misc[settings]>=0.1.3",
    # `typing_extensions.sentinel`, see `anndata.acc`
    "typing-extensions>=4.16; python_version<'3.15'",
    "zarr>=3.1",
]
optional-dependencies.cu11 = [ "cupy-cuda11x" ]
optional-dependencies.cu12 = [ "cupy-cuda12x" ]
optional-dependencies.cu13 = [ "cupy-cuda13x" ]
# https://github.com/dask/dask/issues/11290
# https://github.com/dask/dask/issues/11752
optional-dependencies.dask = [
    "dask!=2024.8.*,!=2024.9.*,!=2025.2.*,!=2025.3.*,!=2025.4.*,!=2025.5.*,!=2025.6.*,!=2025.7.*,!=2025.8.*",
    "dask[array]>=2024.5.1",
]
optional-dependencies.gpu = [ "cupy" ]
# requests and aiohttp needed for zarr remote data
optional-dependencies.lazy = [ "aiohttp", "anndata[dask]", "requests", "xarray>=2025.6.1" ]
urls.Documentation = "https://anndata.readthedocs.io/"
urls.Home-page = "https://github.com/scverse/anndata"
urls.Source = "https://github.com/scverse/anndata"

[dependency-groups]
dev = [
    { include-group = "dev-doc" },
    { include-group = "typing" },
]
test = [
    "anndata[lazy]",
    "fast-array-utils>=1.2.3",
    { include-group = "test-min" },
]
dev-doc = [
    "towncrier>=24.8", # release notes tool
    "types-array-api", # for dev and linking in the docs
]
doc = [
    "anndata[dask]",
    "awkward>=2.6.3",
    "ipython",                            # For syntax highlighting in notebooks
    "mudata",
    "myst-nb>=1.4",
    "myst-parser",
    "pandas>=3",
    "scanpydoc[theme,typehints]>=0.17.1",
    "scverse-misc[sphinx]",
    "sphinx>=9.1",
    "sphinx-autodoc-typehints>=3.13.2",
    "sphinx-book-theme>=1.1",
    "sphinx-copybutton",
    "sphinx-design",
    "sphinx-issues>=5.0.1",
    "sphinxext-opengraph",
    # for unreleased changes
    { include-group = "dev-doc" },
]
test-array-api = [
    { include-group = "test-jax" },
    { include-group = "test-min" },
]
test-jax = [
    "jax>=0.6",
    "jaxlib>=0.6",
]
test-min = [
    "anndata[dask]",
    "awkward>=2.6.3",
    "boltons",
    "dask[distributed]",
    "filelock",
    "joblib",
    "jsonschema",
    "matplotlib",
    "openpyxl",
    "pooch",
    "pyarrow",
    "pytest",
    "pytest-cov",           # only for VS Code
    "pytest-memray",
    "pytest-mock",
    "pytest-randomly",
    "pytest-xdist[psutil]",
    "scanpy>=1.10",
    "scikit-learn",
]
typing = [
    "docutils-stubs",
    "mudata",           # `anndata.acc`
    "pandas-stubs",
    "scipy-stubs",
    "types-boltons",
    "types-jsonschema",
    "types-psutil",
    "types-tqdm",
]

[tool.hatch]
version.source = "vcs"
version.raw-options.version_scheme = "release-branch-semver"
build.targets.wheel.packages = [ "src/anndata", "src/testing" ]

[tool.ruff]
src = [ "src" ]
format.preview = true
format.docstring-code-format = true
lint.select = [
    "ANN",  # Annotations
    "B",    # Likely bugs and design issues
    "BLE",  # Blind except
    "C4",   # Comprehensions
    "E",    # Error detected by Pycodestyle
    "EM",   # Traceback-friendly error messages
    "F",    # Errors detected by Pyflakes
    "FBT",  # Boolean positional arguments
    "I",    # isort
    "ICN",  # Follow import conventions
    "ISC",  # Implicit string concatenation
    "PERF", # Performance
    "PIE",  # Syntax simplifications
    "PL",   # Pylint
    "PT",   # Pytest conventions
    "PTH",  # Pathlib instead of os.path
    "PYI",  # Typing
    "RUF",  # Unused noqa
    "SIM",  # Code simplifications
    "TC",   # manage type checking blocks
    "TID",  # Banned imports
    "UP",   # pyupgrade
    "W",    # Warning detected by Pycodestyle
]
lint.ignore = [
    # TODO: fix these
    "ANN001",
    "ANN002",
    "ANN003",
    "ANN201",
    "ANN202",
    "ANN204",
    "C408",    # dict() syntax is preferable for dicts used as kwargs
    "E501",    # line too long -> we accept long comment lines; formatter gets rid of long code lines
    "E731",    # Do not assign a lambda expression, use a def -> AnnData allows lambda expression assignments,
    "E741",    # allow I, O, l as variable names -> I is the identity matrix, i, j, k, l is reasonable indexing notation
    "PLC0415", # We use a lot of non-top-level imports
    "PLR2004", # “2” is often not too “magic” a number
    "PLW2901", # Shadowing loop variables isn’t a big deal
    "TID252",  # We use relative imports from parent modules
]
# PLR0913, PLR0917: tests can use a lot of “arguments” that are actually fixtures
lint.per-file-ignores."tests/**/*.py" = [ "PLR0913", "PLR0917" ]
# E721 comparing types, but we specifically are checking that we aren't getting subtypes (views)
lint.per-file-ignores."tests/test_readwrite.py" = [ "E721" ]
lint.allowed-confusables = [ "×", "–", "’", "α" ]
lint.flake8-bugbear.extend-immutable-calls = [ "slice" ]
lint.flake8-type-checking.exempt-modules = []
lint.flake8-type-checking.runtime-evaluated-base-classes = [ "scverse_misc.Settings" ]
lint.flake8-type-checking.strict = true
lint.isort.known-first-party = [ "anndata" ]
lint.isort.required-imports = [ "from __future__ import annotations" ]
lint.pylint.max-args = 7
lint.pylint.max-positional-args = 5

[tool.ruff.lint.flake8-tidy-imports.banned-api]
"legacy_api_wrap.legacy_api".msg = "Use anndata.compat.old_positionals instead"
"subprocess.call".msg = "Use `subprocess.run([…])` instead"
"subprocess.check_call".msg = "Use `subprocess.run([…], check=True)` instead"
"subprocess.check_output".msg = "Use `subprocess.run([…], check=True, capture_output=True)` instead"
"warnings.warn".msg = "Use anndata.utils.warn instead"

[tool.codespell]
ignore-words-list = "theis,coo,homogenous,GroupT,scarches"
# base64 blobs (e.g. images in notebook outputs)
ignore-regex = "[A-Za-z0-9+/]{100,}={0,2}"
skip = ".git,*.pdf,*.svg"

[tool.pyproject-fmt]
indent = 4
table_format = "short"
expand_tables = [
    "tool.ruff.lint.flake8-tidy-imports.banned-api",
]

[tool.mypy]
mypy_path = [ "src" ]
explicit_package_bases = true
warn_redundant_casts = true
warn_unused_ignores = true

# Installed, but shipping no `py.typed` marker:
# infer types from their source instead of falling back to `Any`.
[[tool.mypy.overrides]]
module = [
    "awkward.*",
    "h5py.*",
    "joblib.*",
    "mudata.*",
    "numcodecs.*",
    "pyarrow.*",
    "scanpy.*",
    "sklearn.*",
]
follow_untyped_imports = true

# Dependencies that ship no type information (absent or `Incomplete` annotations).
[[tool.mypy.overrides]]
module = [
    "array_api_compat.*",
    "cupy.*",
    "cupyx.*",
    "jax.*",
    "loompy.*",
    "memory_profiler",
    "pooch",
    "sphinx.*",
    "torch.*",
    "zappy.*",
]
ignore_missing_imports = true

[tool.pytest]
addopts = [
    "--import-mode=importlib",
    "--doctest-modules",
    "--pyargs",
    "-ptesting.anndata._pytest",
    "--dist=loadgroup",
]
filterwarnings = [
    "ignore::anndata._warnings.OldFormatWarning",
    "ignore::anndata._warnings.ExperimentalFeatureWarning",
    # scanpy 1.10.x
    "ignore:.*first_column_names:FutureWarning:scanpy",
    "ignore:Importing read_.* from `anndata` is deprecated:FutureWarning:scanpy",
    "ignore:`__version__` is deprecated:FutureWarning:scanpy",
    # https://github.com/matplotlib/matplotlib/pull/30589
    """\
    ignore:.*'(oneOf|parseString|resetCache|enablePackrat)'.*'(one_of|parse_string|reset_cache|enable_packrat)':Depreca\
    tionWarning:matplotlib\
    """,
    # TODO: remove when https://github.com/scikit-hep/awkward/issues/4078 is resolved
    "ignore:Setting the shape on a NumPy array has been deprecated:DeprecationWarning",
]
# When `--strict-warnings` is used, all warnings are treated as errors, except those:
filterwarnings_when_strict = [
    "default::anndata._warnings.ImplicitModificationWarning",
    "default:Transforming to str index:UserWarning",
    "default:(Observation|Variable) names are not unique. To make them unique:UserWarning",
    "default::scipy.sparse.SparseEfficiencyWarning",
    "default::dask.array.core.PerformanceWarning",
    # TODO: Remove when https://github.com/zarr-developers/zarr-python/pull/3979 becomes min
    "default:.*FixedLengthUTF32:zarr.core.dtype.common.UnstableSpecificationWarning",
    "default:Writing zarr v2:UserWarning",
]
# For some reason this effects how logging is shown when tests are run
markers = [
    "gpu: mark test to run on GPU",
    "zarr_io: mark tests that involve zarr io",
    "dask_distributed: tests that need a distributed client with multiple processes",
    "array_api: tests specific to the array-api",
]
python_files = [ "test_*.py" ]
strict = true
testpaths = [
    "anndata",                            # docstrings (module name due to --pyargs)
    "./tests",                            # unit tests
    "./ci/scripts",                       # CI script tests
    # further doctests
    "./docs/accessors.rst",
    "./docs/tutorials/concatenation.rst",
]

[tool.coverage]
run.data_file = "test-data/raw-coverage"
run.omit = [ "**/test_*.py", "src/anndata/_version.py" ]
run.patch = [ "subprocess" ]
run.source_pkgs = [ "anndata" ]
paths.source = [ "./src", "**/site-packages" ]
report.exclude_also = [
    "if TYPE_CHECKING:",
]
xml.output = "test-data/coverage.xml"

[tool.towncrier]
package = "anndata"
package_dir = "src"
directory = "docs/release-notes"
filename = "docs/release-notes/{version}.md"
title_format = "(v{version})=\n### {version} {{small}}`{project_date}`"
issue_format = "{{pr}}`{issue}`"
single_file = false
# Valid fragments should be a subset of conventional commit types (except for `breaking`):
# https://github.com/commitizen/conventional-commit-types/blob/master/index.json
# style, refactor, test, build, ci: should not go into changelog
fragment.breaking.name = "Breaking changes"  # add `!` to commit type (e.g. “feature!:”)
fragment.chore.name = "Miscellaneous changes"
fragment.docs.name = "Documentation"
fragment.feat.name = "Features"
fragment.fix.name = "Bug fixes"
fragment.perf.name = "Performance"
fragment.revert.name = "Revert"
